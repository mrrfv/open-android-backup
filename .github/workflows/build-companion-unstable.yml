name: Build Unstable
on:
  push:
    branches:
      - master
  workflow_dispatch:

# The release is published on GitHub Pages, not Releases, so we don't need write permissions
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      working-directory: ./companion_app
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable' # or: 'beta', 'dev' or 'master'
        flutter-version-file: companion_app/pubspec.yaml
    - run: flutter pub get
      working-directory: ${{ env.working-directory }}
    - name: Setup keystore
      # TODO: Don't hardcode the keystore location (/home/runner/...)
      run: |
        mkdir -p /home/runner/.android
        echo ${{ secrets.ANDROID_BUILD_KEYSTORE_BASE64 }} | base64 --decode > /home/runner/.android/release.keystore
        echo keyPassword=\${{ secrets.ANDROID_BUILD_KEY_PASSWORD }} > ${{ env.working-directory }}/android/key.properties
        echo storePassword=\${{ secrets.ANDROID_BUILD_STORE_PASSWORD }} >> ${{ env.working-directory }}/android/key.properties
        echo keyAlias=\${{ secrets.ANDROID_BUILD_KEY_ALIAS }} >> ${{ env.working-directory }}/android/key.properties
        echo storeFile=/home/runner/.android/release.keystore >> ${{ env.working-directory }}/android/key.properties
    - name: Build fat APK
      run: flutter build apk --release
      working-directory: ${{ env.working-directory }}
    - name: Build split per ABI APKs
      run: flutter build apk --release --split-per-abi
      working-directory: ${{ env.working-directory }}
    - name: Delete keystore and other secrets
      run: |
        rm -rf /home/runner/.android
        rm -rf ${{ env.working-directory }}/android/key.properties
    - run: cp -v companion_app/build/app/outputs/flutter-apk/app-release.apk ./open-android-backup-companion.apk
    - run: sudo apt update && sudo apt install p7zip-full
    - run: 7z a -bb3 -tzip -mx9  -x!.*\* -x!website\* -x!companion_app\* -x!convenience-scripts\* Open_Android_Backup_Unstable_Bundle.zip .

    - name: Collect preview files
      run: |
        mkdir -p preview
        cp -v Open_Android_Backup_Unstable_Bundle.zip preview/
        cp -v companion_app/build/app/outputs/flutter-apk/app-release.apk \
              companion_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
              companion_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
              companion_app/build/app/outputs/flutter-apk/app-x86_64-release.apk \
              preview/
        {
          echo "Commit: ${{ github.sha }}"
          echo "Built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "This is an unstable version of Open Android Backup, containing the latest updates which have not yet been tested thoroughly. Use at your own risk."
        } > preview/build-info.txt
    - uses: actions/upload-artifact@v4
      with:
        name: preview-files
        path: preview/
        if-no-files-found: error
        retention-days: 3

  # Deploy the website, including the unstable build, to GitHub Pages
  deploy-pages:
    needs: build
    # Also deploy the website when the app build failed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Don't cancel running deployments, but never run two at once
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
    - uses: actions/configure-pages@v5
    - name: Render website
      run: |
        npm ci
        npm run deploy
        rm -rfv ./node_modules .* package*.json || true
      working-directory: ./website
    - name: Download the new unstable build
      id: download
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: preview-files
        path: website/preview
    - name: Serve previous unstable build if the current one failed
      # If the build failed, keep serving the last good one instead of deleting it with this deployment
      if: ${{ steps.download.outcome != 'success' }}
      run: |
        mkdir -p website/preview
        base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview"
        for f in app-release.apk app-armeabi-v7a-release.apk app-arm64-v8a-release.apk app-x86_64-release.apk Open_Android_Backup_Unstable_Bundle.zip build-info.txt; do
          curl -sfL -o "website/preview/$f" "$base/$f" || rm -f "website/preview/$f"
        done
        ls -l website/preview
    - uses: actions/upload-pages-artifact@v3
      with:
        path: './website'
    - id: deployment
      uses: actions/deploy-pages@v4
